name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The GITHUB_TOKEN only needs to read the repo (checkout + Rokit tool downloads).
permissions:
  contents: read

# Tool versions (rojo, wally, selene, stylua, lune) are pinned in rokit.toml and
# installed by setup-rokit, so CI matches local development exactly.

jobs:
  style:
    name: Style (stylua + selene)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Rokit
        uses: ./.github/actions/setup-rokit

      - name: Check formatting
        run: stylua --check src tests ExampleProject

      - name: Lint
        run: selene src tests

  test:
    name: Tests + coverage gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Rokit
        uses: ./.github/actions/setup-rokit

      - name: Run unit tests (fails if coverage drops below 100%)
        run: lune run tests/runTests.luau

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Rokit
        uses: ./.github/actions/setup-rokit

      - name: Build model
        run: rojo build default.project.json --output posthog-roblox.rbxm

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: posthog-roblox
          path: posthog-roblox.rbxm
          if-no-files-found: error
