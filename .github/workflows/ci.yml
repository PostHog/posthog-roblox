name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The GITHUB_TOKEN only needs to read the repo (checkout + Rokit tool downloads).
permissions:
  contents: read

# Tool versions (rojo, wally, selene, stylua, lune) are pinned in rokit.toml and
# installed by setup-rokit, so CI matches local development exactly.

jobs:
  style:
    name: Style (stylua + selene)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rokit
        uses: ./.github/actions/setup-rokit

      - name: Check formatting
        run: stylua --check src tests ExampleProject

      - name: Lint
        run: selene src tests

  test:
    name: Tests + coverage gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rokit
        uses: ./.github/actions/setup-rokit

      - name: Run unit tests (fails if coverage drops below 100%)
        run: lune run tests/runTests.luau

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Rokit
        uses: ./.github/actions/setup-rokit

      - name: Build model
        run: rojo build default.project.json --output posthog-roblox.rbxm

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: posthog-roblox
          path: posthog-roblox.rbxm
          if-no-files-found: error
