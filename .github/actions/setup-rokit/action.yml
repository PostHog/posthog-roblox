name: Setup Rokit
description: Install Rokit and the project toolchain (rojo, wally, selene, stylua, lune) without a third-party action.

inputs:
  token:
    description: GitHub token used to authenticate Rokit tool downloads and avoid API rate limits.
    default: ${{ github.token }}
    required: false

runs:
  using: composite
  steps:
    - name: Cache Rokit tools
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.rokit/bin
          ~/.rokit/tool-storage
        key: ${{ runner.os }}-rokit-${{ hashFiles('rokit.toml') }}

    - name: Install Rokit and project tools
      shell: bash
      env:
        ROKIT_VERSION: "1.2.0"
        GITHUB_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        tmp="$(mktemp -d)"
        curl --proto '=https' --tlsv1.2 -fsSL \
          "https://github.com/rojo-rbx/rokit/releases/download/v${ROKIT_VERSION}/rokit-${ROKIT_VERSION}-linux-x86_64.zip" \
          -o "$tmp/rokit.zip"
        unzip -q "$tmp/rokit.zip" -d "$tmp"
        "$tmp/rokit" self-install
        rokit_bin="$HOME/.rokit/bin"
        echo "$rokit_bin" >> "$GITHUB_PATH"
        "$rokit_bin/rokit" authenticate github --token "$GITHUB_TOKEN"
        "$rokit_bin/rokit" install --no-trust-check
